<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solo Learning</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="landing.css">
<link rel="stylesheet" href="mascot.css">
<link rel="stylesheet" href="solo.css">
</head>
<body>

<header class="bar">
  <button id="menu" class="icon" title="Chapters">☰</button>
  <a class="brand" href="#"><span class="brand-mark">SL</span>Solo <b>Learning</b></a>
  <div class="find-wrap">
    <span class="find-ico">⌕</span>
    <input id="find" type="search" placeholder="Search any chapter or topic" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <div class="spacer"></div>
  <button id="zoomOut" class="icon" title="Smaller diagrams">A−</button>
  <button id="zoomIn" class="icon" title="Larger diagrams">A+</button>
  <button id="theme" class="icon" title="Light / dark">◐</button>
</header>

<div id="hits" class="hits" hidden></div>
<p id="rootline" hidden></p>

<div class="shell">
  <nav id="side" class="side"></nav>
  <main id="main" class="main"></main>
  <aside id="toc" class="toc"></aside>
</div>

<script src="vendor/katex/katex.min.js"></script>
<script src="tex.js"></script>
<script src="typeset.js"></script>
<script src="md.js"></script>
<script src="anim.js"></script>
<script src="app.js"></script>
<script src="toc.js"></script>
<script src="wide.js"></script>
<script type="module" src="home.js"></script>
<script type="module" src="solo.js"></script>
<script type="module" src="landing.js"></script>
</body>
</html>
